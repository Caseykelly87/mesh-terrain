# Passes the CA bundle named by CA_BUNDLE_PATH in .env to the Dagster image
# build as the BuildKit secret ca_bundle (docker/dagster/Dockerfile says why).
# The Makefile adds this file to every compose command only when
# CA_BUNDLE_PATH is set. Compose has no optional build secret: an empty path
# resolves to the project folder and the build fails reading it, so a build
# without the bundle, as in CI, must not see this file at all.
services:
  dagster-migrate:
    build:
      secrets: [ca_bundle]
  dagster-webserver:
    build:
      secrets: [ca_bundle]
  dagster-daemon:
    build:
      secrets: [ca_bundle]

secrets:
  ca_bundle:
    file: ${CA_BUNDLE_PATH}
