mesh_terrain:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST') }}"
      port: "{{ env_var('WAREHOUSE_PORT') | as_number }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      # The target schema is only the default; every model folder pins its own
      # schema in dbt_project.yml and the macro below keeps that name exact.
      schema: staging
      threads: 4
      connect_timeout: 10
