version: 2

models:
  - name: stg_position
    description: >
      One row per raw Position or MapReport row, each snapshot's copy kept,
      with the cell as sent and what pos_01 derives from it. A Position at 0, 0
      is mapped to no position and flagged (pos_03); a row without both
      coordinates has no position either, and keeps its other coordinate as
      sent.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["snapshot_id", "delivery_key"]
    columns:
      - name: snapshot_id
        description: The snapshot the row was loaded from.
        tests:
          - not_null
      - name: delivery_key
        description: The delivery's key (ing_01); the same delivery in two snapshots has one row in each.
        tests:
          - not_null
      - name: received_at
        description: When our capture received the delivery, in UTC.
        tests:
          - not_null
      - name: node_pseudonym
        description: The pseudonym of the node the position belongs to, the packet's origin.
        tests:
          - not_null
      - name: position_source
        description: position for a Position packet, mapreport for a MapReport (pos_04).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["position", "mapreport"]
      - name: seen_public
        description: True when the public broker carried the delivery.
      - name: seen_meshstl
        description: True when the MeshSTL broker carried the delivery.
      - name: position_zero_mapped
        description: True for a Position sent at 0, 0, which staging maps to no position (pos_03).
        tests:
          - not_null
      - name: latitude_i
        description: >
          Latitude in 1e-7 degrees as sent: the cell centre for 1 to 31 bits and
          the raw value at 32 (pos_01). Null when missing or mapped from 0, 0.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -900000000
                max_value: 900000000
              config:
                meta: {contract: pos_03}
      - name: longitude_i
        description: Longitude in 1e-7 degrees as sent, under the same rules as latitude_i.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1800000000
                max_value: 1800000000
              config:
                meta: {contract: pos_03}
      - name: precision_bits
        description: >
          The precision the sender gave, a 64-bit integer kept as sent; null
          when the row has no position (pos_01).
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 32
              config:
                where: "cell_width_i is not null"
                meta: {contract: pos_01}
      - name: position_quality
        description: usable for 15 to 32 bits, coarse for 12 to 14, unusable otherwise; null when the row has no position (pos_01).
        tests:
          - accepted_values:
              arguments:
                values: ["usable", "coarse", "unusable"]
              config:
                meta: {contract: pos_01}
      - name: cell_width_i
        description: >
          The cell's width on each axis in 1e-7 degrees, 2^(32 - precision_bits);
          null at 0 bits, outside 0 to 32 and without a position (pos_01).
      - name: half_width_ns_m
        description: Half the cell's north-south extent in metres on the WGS84 ellipsoid at the stored latitude (pos_01).
      - name: half_width_ew_m
        description: Half the cell's east-west extent in metres on the WGS84 ellipsoid at the stored latitude (pos_01).
      - name: precise_source
        description: >
          True when the MeshSTL broker carried this copy of the delivery and
          precision_bits is 20 or more, or 0, Position or MapReport alike
          (pos_04; Casey, issue #55 comment 6989099568, item 2); null when the row
          has no position. Core reads every copy.
