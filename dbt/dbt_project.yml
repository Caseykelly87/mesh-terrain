name: mesh_terrain
version: "0.1.0"
profile: mesh_terrain

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - dbt_packages

# Creates the development target's raw, staging, core and analytics schemas
# when absent; on prod, stops the run unless make dbt-build-real passed
# --vars '{real_build: true}' (macros/target_schemas.sql).
on-run-start:
  - "{{ create_target_schemas() }}"

models:
  mesh_terrain:
    # Schema names here must stay equal to the schemas the warehouse init SQL
    # creates. On prod the schema macro uses them as they are; every other
    # target suffixes them with its own name (macros/target_schemas.sql).
    staging:
      +schema: staging
      +materialized: view
    core:
      +schema: core
      +materialized: incremental
    analytics:
      +schema: analytics
      +materialized: table

seeds:
  mesh_terrain:
    +schema: staging
    msa_boundary:
      # Explicit text types so dbt does not infer a varchar limit from the
      # sample or read the five-digit code as a number.
      +column_types:
        geoid: text
        name: text
        source: text
        part: integer
        geometry_wkt: text
