name: mesh_terrain
version: "0.1.0"
profile: mesh_terrain

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - dbt_packages

# Creates the development target's raw, staging, core and analytics schemas
# when absent; on prod, stops the run unless make dbt-build-real passed
# --vars '{real_build: true}' (macros/target_schemas.sql).
on-run-start:
  - "{{ create_target_schemas() }}"

models:
  mesh_terrain:
    # Schema names here must stay equal to the schemas the warehouse init SQL
    # creates. On prod the schema macro uses them as they are; every other
    # target suffixes them with its own name (macros/target_schemas.sql).
    staging:
      +schema: staging
      +materialized: view
    core:
      +schema: core
      +materialized: incremental
    analytics:
      +schema: analytics
      +materialized: table

seeds:
  mesh_terrain:
    +schema: staging
    msa_boundary:
      # Explicit text types so dbt does not infer a varchar limit from the
      # sample or read the five-digit code as a number.
      +column_types:
        geoid: text
        name: text
        source: text
        part: integer
        geometry_wkt: text
    # Expected values for the synthetic fixtures (tests/fixture_positions.py).
    # Built only where the fixture build runs, a development target with the
    # var raw_schema set (macros/raw_schema.sql, fixture_build), and never on
    # prod; dbt does not offer project macros here, so the test is inline.
    fixtures:
      +enabled: "{{ target.name != 'prod' and var('raw_schema', none) is not none }}"
      expected_fixture_positions:
        +column_types:
          snapshot_id: text
          delivery_key: text
          node_pseudonym: text
          position_source: text
          position_zero_mapped: boolean
          latitude_i: integer
          longitude_i: integer
          precision_bits: bigint
          position_quality: text
          cell_width_i: bigint
          south_i: bigint
          north_i: bigint
          west_i: bigint
          east_i: bigint
          half_width_ns_m: double precision
          half_width_ew_m: double precision
          precise_source: boolean
          inside_msa: boolean
          in_core: boolean
          core_precise_source: boolean
