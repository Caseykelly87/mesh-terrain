[project]
name = "mesh-terrain"
version = "0.1.0"
description = "Terrain-aware validation of Meshtastic LoRa link quality across the St. Louis metro"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # terrain.draws imports affine itself. It arrives through rasterio today,
    # and a rasterio release that dropped it would break the import unseen.
    "affine==3.0.1",
    "cryptography==50.0.2",
    "dagster==1.13.26",
    "dagster-dbt==0.29.26",
    "dagster-postgres==0.29.26",
    "dagster-webserver==1.13.26",
    "dbt-core==1.12.6",
    "dbt-postgres==1.11.0",
    "geopandas==1.2.0",
    "meshtastic==2.7.11",
    "numpy==2.5.4",
    "paho-mqtt==2.2.0",
    "psycopg[binary]==3.3.6",
    "pyarrow==26.0.1",
    # No PyPI release and no tags upstream, so the commit archive is the pin and
    # uv.lock records its sha256 (ADR 0006).
    "py1812 @ https://github.com/eeveetza/Py1812/archive/6c9061dd022e93c84169059a016643926ce89964.tar.gz",
    "pydantic-settings==2.16.1",
    "pyproj==3.8.0",
    "pyrosm==0.29.0",
    "pyyaml==6.0.3",
    "rasterio==1.5.2",
    "rio-cogeo==7.0.4",
    "scipy==1.18.1",
    "shapely==2.2.0",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
# py1812 builds from source with flit_core >=3.2,<4. The build tool is pinned
# exactly, as hatchling is above, so a new flit_core release cannot change the
# wheel (ADR 0006).
build-constraint-dependencies = ["flit-core==3.12.0"]

# Keeps py1812's archive URL in the project metadata. A [tool.uv.sources]
# entry would leave a bare "py1812" there, which any installer other than uv
# would look up on PyPI, where the name is unclaimed. The setting allows a
# direct reference for every dependency; py1812 is the only one.
[tool.hatch.metadata]
allow-direct-references = true

# engine is listed before terrain-rf-eng creates it: hatchling leaves a missing
# package out of the wheel, so the build passes now and includes it later.
[tool.hatch.build.targets.wheel]
packages = ["pipeline", "terrain", "ingester", "engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ADR spike scripts are recorded experiments, not production code. ruff 0.17
# formats Python code fences inside Markdown, and the style guide's example
# signature is deliberately wider than the line limit.
extend-exclude = ["notebooks", "dbt/dbt_packages", "dbt/target", "docs/adr", "*.md"]

[tool.ruff.lint]
# The engine config is loaded with yaml.safe_load only (Casey, PR #27,
# 2026-11-15). S506, alone from the bandit set, fails yaml.load unless its
# Loader is SafeLoader or CSafeLoader. TID251 fails the names listed below,
# which S506 does not look at, wherever they are used or imported, from the
# top-level yaml module or from yaml.loader and yaml.cyaml where the Loader
# classes are defined.
select = ["E", "F", "I", "UP", "B", "N", "S506", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"yaml.unsafe_load".msg = "Load YAML with yaml.safe_load."
"yaml.unsafe_load_all".msg = "Load YAML with yaml.safe_load."
"yaml.full_load".msg = "Load YAML with yaml.safe_load."
"yaml.full_load_all".msg = "Load YAML with yaml.safe_load."
"yaml.load_all".msg = "Load YAML with yaml.safe_load."
"yaml.Loader".msg = "Load YAML with yaml.safe_load."
"yaml.UnsafeLoader".msg = "Load YAML with yaml.safe_load."
"yaml.FullLoader".msg = "Load YAML with yaml.safe_load."
"yaml.CLoader".msg = "Load YAML with yaml.safe_load."
"yaml.CUnsafeLoader".msg = "Load YAML with yaml.safe_load."
"yaml.CFullLoader".msg = "Load YAML with yaml.safe_load."
"yaml.loader.Loader".msg = "Load YAML with yaml.safe_load."
"yaml.loader.UnsafeLoader".msg = "Load YAML with yaml.safe_load."
"yaml.loader.FullLoader".msg = "Load YAML with yaml.safe_load."
"yaml.cyaml.CLoader".msg = "Load YAML with yaml.safe_load."
"yaml.cyaml.CUnsafeLoader".msg = "Load YAML with yaml.safe_load."
"yaml.cyaml.CFullLoader".msg = "Load YAML with yaml.safe_load."

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "terrain", "ingester"]

[tool.mypy]
python_version = "3.12"
# docker/check_p1812.py is the one Python script behind a make target outside
# the packages; it calls terrain/ and is checked to the same standard.
files = ["pipeline", "terrain", "ingester", "docker/check_p1812.py"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# pyarrow, protobuf, meshtastic and Py1812 carry no py.typed marker. Each
# imported module is listed by name, so a new untyped import still fails until
# someone decides how to type it. follow_untyped_imports fails here: mypy cannot
# see pyarrow's public names, which come from compiled modules, and protobuf's
# runtime is unannotated, which strict mode rejects at every call.
#
# The untyped engine packages and PyYAML are listed whole as name.*, which
# mypy matches against the package and every submodule, because the decision
# is the same for every module in them and the engine will import many. Stub
# packages exist for scipy, shapely, geopandas and PyYAML, but they are outside
# the plan's stack table. numpy, pyproj and rio-cogeo ship py.typed and are
# checked.
[[tool.mypy.overrides]]
module = [
    "google.protobuf.message",
    "meshtastic.protobuf",
    "Py1812",
    "Py1812.P1812",
    "pyarrow",
    "pyarrow.compute",
    "pyarrow.parquet",
    "geopandas.*",
    "pyrosm.*",
    "rasterio.*",
    "scipy.*",
    "shapely.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pipeline", "terrain", "ingester"]
