name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the running workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.4"

jobs:
  lint-and-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing major tags after v7, so the exact tag is pinned.
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # The definitions test parses the dbt project, which reads the profile's
      # environment variables; the example values are enough because parse
      # never connects.
      - run: cp .env.example .env
      - run: make test
      # The real map snapshot is never in CI, so the target runs on the
      # committed synthetic maps, whose DN 40 and N0 325 give 149.45 dB on the
      # flat path; this keeps the target's command line working.
      - run: make check-p1812 FIXTURE=tests/fixtures/snapshots/p1812-maps-synthetic EXPECT_DB=149.45
      # An EXPECT_DB without FIXTURE would let a stand-in folder pass as the
      # ITU maps, so make must refuse it before running anything.
      - name: check that check-p1812 refuses EXPECT_DB without FIXTURE
        run: |
          if output=$(make -n check-p1812 SNAPSHOTS_DIR=x EXPECT_DB=1 2>&1); then
            echo "accepted: $output"; exit 1
          fi
          echo "$output" | grep -q "EXPECT_DB needs FIXTURE"
      # Without --fixture the map files must match the ITU pins, so the
      # synthetic maps must fail with exit 1 before any loss is computed.
      - name: check that check_p1812.py refuses maps that are not the pinned ITU ones
        run: |
          status=0
          output=$(uv run --frozen python -I docker/check_p1812.py tests/fixtures/snapshots/p1812-maps-synthetic 2>&1) || status=$?
          echo "$output"
          test "$status" -eq 1
          echo "$output" | grep -q "not the pinned ITU maps"

  dbt-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: cp .env.example .env
      # Compose builds the warehouse image from the same Dockerfile and init
      # SQL developers use, so CI checks the real artefact rather than a stock
      # service container without h3-pg.
      - run: docker compose up --build --detach --wait --wait-timeout 300 warehouse
      - run: make dbt-debug
      - run: make dbt-build
      - if: always()
        run: docker compose down --volumes --remove-orphans

  # A job of its own because the PDAL image is 821 MB compressed; in parallel
  # it adds about a minute of pull without lengthening the stack smoke test.
  # No lidar is read: the runner has no CA problem to test, and the EPT read
  # is the snapshot command's to verify.
  pdal-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: make check-pdal
      # On Linux a container that runs as root leaves root-owned files the
      # snapshot command cannot rename or hash, so the owner is checked.
      - name: run a synthetic pipeline through make pdal
        run: |
          work="$RUNNER_TEMP/pdal-work"
          mkdir -p "$work"
          make pdal PIPELINE=docker/pdal/smoke-pipeline.json WORKDIR="$work"
          test -s "$work/smoke.tif"
          owner=$(stat -c %u "$work/smoke.tif")
          test "$owner" = "$(id -u)" && test "$owner" != 0
      # No code path writes into a finished snapshot (ing_02): inside the
      # snapshots folder only a <id>.partial folder directly below it is
      # accepted, and a WORKDIR holding the snapshots or the checkout's .env
      # is refused. A refusal is told apart from a failed run by its message,
      # since make exits 2 for both.
      - name: check that make pdal refuses unsafe work folders
        run: |
          snapshots="$RUNNER_TEMP/snapshots"
          mkdir -p "$snapshots/finished-1/x.partial" "$snapshots/next-1.partial"
          run_in() {
            make pdal PIPELINE=docker/pdal/smoke-pipeline.json WORKDIR="$1" \
              SNAPSHOTS_DIR="$snapshots" SNAPSHOTS_HOST_DIR="$snapshots" 2>&1
          }
          for workdir in "$snapshots" "$snapshots/finished-1" "$snapshots/finished-1/x.partial" "$RUNNER_TEMP" "$PWD"; do
            if output=$(run_in "$workdir"); then echo "accepted $workdir"; exit 1; fi
            echo "$output" | grep -q "make pdal: refused" || { echo "$output"; exit 1; }
          done
          run_in "$snapshots/next-1.partial"
          test -s "$snapshots/next-1.partial/smoke.tif"

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # .env.example names Casey's snapshots folder. The runner mounts an empty
      # folder instead, which is enough to check that the mount is read-only.
      - name: point the snapshot mount at an empty folder
        run: |
          make env
          mkdir -p "$RUNNER_TEMP/snapshots"
          sed -i "s|^SNAPSHOTS_HOST_DIR=.*|SNAPSHOTS_HOST_DIR=$RUNNER_TEMP/snapshots|" .env
      # Casey decided that nothing in this project starts on its own (PR #12),
      # so a restart policy other than "no" fails here. Capture runs are started
      # by hand and are not Compose services (ADR 0005 item 1), so nothing is
      # exempt. Every profile is enabled because config leaves out a service
      # whose profile is off, such as pdal.
      - name: check that no service restarts on its own
        run: |
          make env
          docker compose --profile '*' config --format json | jq -e '[.services[].restart] | all(. == "no")'
      - run: make up
      # make up passes when the code location fails to import, because the
      # webserver reports the error in its UI and stays healthy. PR #15's
      # ingester import failed that way in the image while every job was green.
      - name: check that the Dagster code location loads in the image
        run: make check-definitions
      # Nothing overwrites a snapshot (snp_01); the read-only mount is what
      # stops an asset from doing it, so this fails if the :ro goes.
      - name: check that the snapshots folder is mounted read-only
        run: |
          for service in dagster-webserver dagster-daemon; do
            docker compose exec -T "$service" sh -c \
              'test "$SNAPSHOTS_DIR" = /snapshots && test -d /snapshots && ! touch /snapshots/probe 2> /dev/null'
          done
      # The ITM library exists only in the Dagster image (ADR 0002), so the
      # tests that call it skip in the tests job and run here, where a skip
      # fails the step. This also catches a broken ITM build stage.
      - name: check the ITM library in the Dagster image
        run: make check-itm
      # The committed fixture with itm, through make engine as a real run goes:
      # the synthetic snapshots stand in for SNAPSHOTS_HOST_DIR and a runner
      # folder for RUNS_HOST_DIR. A finished run renames its folder after the
      # manifest, so the manifest's presence is the pass.
      - name: run the engine fixture in the Dagster image
        run: |
          runs="$RUNNER_TEMP/runs"
          mkdir -p "$runs"
          make engine CONFIG=engine/fixtures/fixture-run-itm.yaml \
            SNAPSHOTS_HOST_DIR="$PWD/tests/fixtures/snapshots" RUNS_HOST_DIR="$runs"
          test -f "$runs/fixture-itm/manifest.json"
          test ! -e "$runs/fixture-itm.partial"
          jq -e '.itm_source_commit | test("^[0-9a-f]{40}$")' "$runs/fixture-itm/manifest.json"
          jq -e '.engine_git_commit == env.GITHUB_SHA' "$runs/fixture-itm/manifest.json"
      - run: make check
      - if: always()
        run: docker compose logs --no-color dagster-migrate dagster-webserver dagster-daemon minio-bootstrap
      - if: always()
        run: make down
      # Casey decided on 2026-10-31 that make down keeps the data and only make
      # nuke deletes it. Without a terminal, make nuke must refuse unless
      # CONFIRM=nuke is on the make command line; one in the environment does
      # not count, which is how scripts are kept from it.
      - name: check that make down kept the volumes and make nuke deletes them
        run: |
          docker volume inspect mesh-terrain_warehouse-data mesh-terrain_minio-data > /dev/null
          if make nuke < /dev/null; then echo "make nuke ran without CONFIRM"; exit 1; fi
          if CONFIRM=nuke make nuke < /dev/null; then echo "make nuke took CONFIRM from the environment"; exit 1; fi
          docker volume inspect mesh-terrain_warehouse-data mesh-terrain_minio-data > /dev/null
          make nuke CONFIRM=nuke
          test -z "$(docker volume ls --quiet --filter label=com.docker.compose.project=mesh-terrain)"
