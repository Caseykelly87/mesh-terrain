name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the running workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.4"

jobs:
  lint-and-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing major tags after v7, so the exact tag is pinned.
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # The definitions test parses the dbt project, which reads the profile's
      # environment variables; the example values are enough because parse
      # never connects.
      - run: cp .env.example .env
      - run: make test

  dbt-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: cp .env.example .env
      # Compose builds the warehouse image from the same Dockerfile and init
      # SQL developers use, so CI checks the real artefact rather than a stock
      # service container without h3-pg.
      - run: docker compose up --build --detach --wait --wait-timeout 300 warehouse
      - run: make dbt-debug
      - run: make dbt-build
      - if: always()
        run: docker compose down --volumes --remove-orphans

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # Casey decided that nothing in this project starts on its own (PR #12),
      # so a restart policy other than "no" fails here. The Phase 1 ingester
      # will use on-failure; exclude it from this check when it lands.
      - name: check that no service restarts on its own
        run: |
          make env
          docker compose config --format json | jq -e '[.services[].restart] | all(. == "no")'
      - run: make up
      # The ITM library is compiled in a build stage of the Dagster image
      # (ADR 0002); loading it and reproducing the spike's flat-path figure
      # here fails CI when that stage breaks, before terrain/itm.py exists.
      - name: check the ITM library in the Dagster image
        run: make check-itm
      - run: make check
      - if: always()
        run: docker compose logs --no-color dagster-migrate dagster-webserver dagster-daemon minio-bootstrap
      - if: always()
        run: make down
      # Casey decided on 2026-10-31 that make down keeps the data and only make
      # nuke deletes it. Without a terminal, make nuke must refuse unless
      # CONFIRM carries the word, which is how scripts are kept from it.
      - name: check that make down kept the volumes and make nuke deletes them
        run: |
          docker volume inspect mesh-terrain_warehouse-data mesh-terrain_minio-data > /dev/null
          if make nuke < /dev/null; then echo "make nuke ran without CONFIRM"; exit 1; fi
          docker volume inspect mesh-terrain_warehouse-data mesh-terrain_minio-data > /dev/null
          make nuke CONFIRM=nuke
          test -z "$(docker volume ls --quiet --filter label=com.docker.compose.project=mesh-terrain)"
