name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the running workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.4"

jobs:
  lint-and-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing major tags after v7, so the exact tag is pinned.
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # The definitions test parses the dbt project, which reads the profile's
      # environment variables; the example values are enough because parse
      # never connects.
      - run: cp .env.example .env
      - run: make test

  dbt-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: cp .env.example .env
      # Compose builds the warehouse image from the same Dockerfile and init
      # SQL developers use, so CI checks the real artefact rather than a stock
      # service container without h3-pg.
      - run: docker compose up --build --detach --wait --wait-timeout 300 warehouse
      - run: make dbt-debug
      - run: make dbt-build
      - if: always()
        run: docker compose down --volumes --remove-orphans

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: make up
      - run: make check
      - if: always()
        run: docker compose logs --no-color dagster-webserver dagster-daemon minio-bootstrap
      - if: always()
        run: make down
